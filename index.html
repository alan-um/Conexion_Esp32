    <script>
        const URL = "http://esp32_alancito.local";

        //setInterval(infoEsp, 1000);
        function infoEsp() {
            try {
                fetch(URL + "/info")
                    .then(response => response.json())
                    .then(data => {
                        console.log(data);
                        document.getElementById('P23').textContent = data.Pin23;
                    })
                    .catch(e => {
                        console.log("Catch del Fetch");
                        console.log(e);
                    })
            }
            catch (e) {
                console.log(e);
            }

        }

        function prenderLed() {

            fetch(URL + "/prender")
                .then(response => response.json())
                .then(data => {
                    console.log(data.msg);
                    //document.getElementById('P23').textContent = data.Pin23;
                })
                .catch(e => {
                    console.log(e);
                })
        }

        function apagarLed() {
            fetch(URL + "/apagar")
                .then(response => response.json())
                .then(data => {
                    console.log(data.msg);
                    //document.getElementById('P23').textContent = data.Pin23;
                })
        }

        //EN DESARROLLO
        setInterval(infoMarcador,1000);
        function infoMarcador() {
            try {
                fetch(URL + "/infoMarcador")
                    .then(response => response.json())
                    .then(data => {
                        console.log(data);
                        document.getElementById('equipo1').textContent = data.goles_equipo_1;
                        document.getElementById('equipo2').textContent = data.goles_equipo_2;
                    })
                    .catch(e => {
                        console.log("Catch del Fetch");
                        console.log(e);
                    })
            }
            catch (e) {
                console.log(e);
            }
        }

        var timerPartido;
        var tiempoDeJuego = 0;
        function updateTiempo() {
            document.getElementById("minutos").textContent = String(Math.floor(tiempoDeJuego / 60)).padStart(2, '0');
            document.getElementById("segundos").textContent = String(tiempoDeJuego % 60).padStart(2, '0');
            if (tiempoDeJuego > 0) {
                tiempoDeJuego -= 1;
            } else {
                clearInterval(timerPartido);
            }
            console.log("updateTiempo");
        }

        function iniciarPartido() {
            //clearInterval(timerPartido);
            tiempoDeJuego = 150;
            updateTiempo();
            timerPartido = setInterval(updateTiempo, 1000);
            document.getElementById("btn-iniciar").disabled = true;
            //document.getElementById("btn-iniciar").classList.replace("mostrar","ocultar");
            
            /* document.getElementById("btn-pausar").disabled = false;
            document.getElementById("btn-pausar").classList.replace("ocultar","mostrar");  
            document.getElementById("btn-reanudar").disabled = true; */
            
            document.getElementById("btn-finalizar").disabled = false;
        }

        function finalizarPartido() {
            clearInterval(timerPartido);
            tiempoDeJuego = 0;
            updateTiempo();
            document.getElementById("btn-iniciar").disabled = false;
            //document.getElementById("btn-iniciar").classList.replace("ocultar","mostrar");

            /* document.getElementById("btn-pausar").disabled = true;
            document.getElementById("btn-pausar").classList.replace("mostrar","ocultar");
            document.getElementById("btn-reanudar").disabled = true;
            document.getElementById("btn-reanudar").classList.replace("mostrar","ocultar"); */
            
            document.getElementById("btn-finalizar").disabled = true;
        }
